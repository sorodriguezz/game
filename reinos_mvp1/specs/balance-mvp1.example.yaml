# HIPÓTESIS DE BALANCE, NO VALORES PUBLICABLES SIN PLAYTESTING.
# Son ejemplos implementables para evitar que agentes inventen números incompatibles.
# Multiplicadores expresados como enteros relativos o porcentajes declarados.
