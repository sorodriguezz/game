# Fragmento de referencia: integrar en el docker-compose ya existente del MVP 1.
# No ejecutar solo: asume servicios "api" y red interna "internal" del compose real.
services:
  battle-server:
    build:
      context: .
      dockerfile: apps/battle-server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BATTLE_SERVER_PORT: '2567'
      BATTLE_INTERNAL_API_URL: http://api:3000
      TACTICAL_MAX_ROOMS: '2'
      TACTICAL_TICK_HZ: '10'
    # Secrets de firma/autenticación por secrets manager o ficheros restringidos.
    expose:
      - '2567'
    networks: [internal]
    # Añadir healthcheck real cuando exista /health en el binario final.
    # Configurar reverse proxy existente: TLS/WSS -> battle-server:2567.
