# Solo desarrollo local: PostgreSQL ligado a loopback.
# No reutilizar estas credenciales en servidores accesibles desde Internet.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reinos_dev
      POSTGRES_PASSWORD: reinos_dev_change_me
      POSTGRES_DB: reinos_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reinos_dev -d reinos_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
